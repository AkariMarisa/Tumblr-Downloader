name: Build APK

on:
  pull_request:
    branches: [master]
  push:
    tags: ['v*']

jobs:
  # ── PR: 构建 debug 验证编译（无需签名）──────────────────────────────
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug

  # ── Tag push: 构建 release + 发布 GitHub Release ─────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout with full history (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          else
            echo "::warning::KEYSTORE_BASE64 secret not set — APK will not be signed"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Generate changelog (EN)
        id: info
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          LAST_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG" 2>/dev/null || true)
          CHANGES=$(if [ -n "$LAST_TAG" ]; then
            git log "$LAST_TAG..HEAD" --oneline --format="- %s"
          else
            git log --oneline --format="- %s"
          fi)

          # Try to read fastlane changelog for this version
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]*' | head -1).txt"
          FL_CHANGELOG=""
          if [ -f "$CHANGELOG_FILE" ]; then
            FL_CHANGELOG=$(cat "$CHANGELOG_FILE")
          fi

          cat > release_body_en.md << ENDBODY
          ## 📦 What's New in ${TAG}
          
          ### ✨ Features
          ${FL_CHANGELOG:-No changelog provided}
          
          ### 📝 Commits
          ${CHANGES}
          
          ---
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...${TAG}
          ENDBODY

      - name: Generate changelog (ZH)
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          LAST_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG" 2>/dev/null || true)
          CHANGES=$(if [ -n "$LAST_TAG" ]; then
            git log "$LAST_TAG..HEAD" --oneline --format="- %s"
          else
            git log --oneline --format="- %s"
          fi)

          CHANGELOG_FILE="fastlane/metadata/android/zh-CN/changelogs/$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]*' | head -1).txt"
          FL_CHANGELOG=""
          if [ -f "$CHANGELOG_FILE" ]; then
            FL_CHANGELOG=$(cat "$CHANGELOG_FILE")
          fi

          cat > release_body_zh.md << ZHBODY
          ## 📦 ${TAG} 更新内容
          
          ### ✨ 功能特性
          ${FL_CHANGELOG:-暂无更新日志}
          
          ### 📝 提交记录
          ${CHANGES}
          
          ---
          **完整变更日志**: https://github.com/${{ github.repository }}/compare/${LAST_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...${TAG}
          ZHBODY

      - name: Merge bilingual release body
        run: |
          {
            cat release_body_en.md
            echo ""
            echo "---"
            echo ""
            echo "# 🌐 中文版"
            echo ""
            cat release_body_zh.md
          } > release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.tag }}
          body_path: release_body.md
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
