name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    # 只有推送 v* tag 时才创建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout with full history (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: info
        run: |
          # 从 GITHUB_REF 提取 tag 名（如 v1.2.3）
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # 生成 changelog：对比上一个 tag 到当前 tag
          LAST_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG" 2>/dev/null || true)
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$LAST_TAG" ]; then
              git log "$LAST_TAG..HEAD" --oneline --format="- %s (%h)"
            else
              git log --oneline --format="- %s (%h)"
            fi
            echo ""
            echo "---"
            if [ -n "$LAST_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$LAST_TAG...${TAG}"
            else
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            fi
          } > release_body.md

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.tag }}
          body_path: release_body.md
          files: app-debug.apk
          make_latest: true
